; Mesh Gateway: USB-serial ↔ ESP-NOW bridge for the orchestrator hub.
; A Raspberry Pi / PC cannot speak ESP-NOW. Plug this ESP32-S3 into the hub
; and run the orchestrator with COCOON_TRANSPORT=serial.
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
lib_deps = symlink://../../shared_core
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -O2 -DARDUINO_USB_CDC_ON_BOOT=1
