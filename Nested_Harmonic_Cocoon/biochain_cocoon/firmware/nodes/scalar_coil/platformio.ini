; Scalar Coil Puck: Node Type D (bifilar pancake coil, experimental)
; Build:   pio run -d firmware/nodes/scalar_coil
; Flash:   pio run -d firmware/nodes/scalar_coil -t upload
; OTA:     python3 deploy/firmware_ota/ota_push.py --node <ip> --firmware .pio/build/esp32s3/firmware.bin
;
; Arduino-ESP32 3.x (ESP-IDF 5) via the pioarduino platform, which
; provides the ESP_I2S / ledcAttach APIs used below.

[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../shared_core
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -DCOCOON_FW_VERSION=\"1.0.0\"


[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv   ; two OTA slots
build_flags =
    ${env.build_flags}
    -DCOCOON_NODE_ID=301

[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = cocoon-scalar-coil.local
